<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>Vela Chauffeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0f12;
    --s1: #17171b;
    --s2: #1f1f24;
    --s3: #2a2a30;
    --s4: #36363e;
    --line: rgba(255, 255, 255, 0.07);
    --fg: #ece9ef;
    --mut: #b7bba5;
    --dim: #8e937b;
    --lime: #c6f338;
    --lime-2: #abd611;
    --ink: #161f00;
    --pink: #ffb1c5;
    --pink-deep: #8e1347;
    --violet: #6050d1;
    --violet-soft: #c7bfff;
    --red: #ff5a52;
    --green: #3ddc84;
    --amber: #ffb020;
    --wa: #25d366;
    --display: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r-sm: 8px;
    --r: 12px;
    --r-lg: 20px;
    --nav-h: 64px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 var(--body);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
    overscroll-behavior-y: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  .ic { flex: 0 0 auto; display: block; }

  /* ---------- Layout shell ---------- */
  .app { display: flex; min-height: 100%; }
  .side { display: none; }
  .shell { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 60px; padding-inline: 16px;
    background: rgba(15, 15, 18, 0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .top-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .top-l h1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-r { display: flex; align-items: center; gap: 6px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; position: relative; color: var(--mut); }
  .icon-btn:hover { color: var(--fg); background: var(--s2); }
  .badge-dot { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--pink); color: #3f001b; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--display); flex: 0 0 auto; }
  .av-driver { background: linear-gradient(135deg, var(--violet), var(--pink-deep)); color: #fff; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .status-dot.on { background: var(--lime); box-shadow: 0 0 0 0 rgba(198, 243, 56, .6); animation: ping 1.8s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(198, 243, 56, 0); } 100% { box-shadow: 0 0 0 0 rgba(198, 243, 56, 0); } }

  main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(23, 23, 27, 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .tabbar-in { height: var(--nav-h); display: flex; justify-content: space-around; align-items: center; max-width: 560px; margin: 0 auto; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 4px; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; position: relative; }
  .tab.on { color: var(--lime); }
  .tab .badge-dot { top: 0; right: 12px; }

  /* ---------- Generic components ---------- */
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .card { background: var(--s1); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
  .inset { background: var(--s2); border-radius: var(--r); padding: 10px 12px; }
  .muted { color: var(--mut); }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }
  .label { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .num { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--s3); }
  .chip-lime { background: var(--lime); color: var(--ink); }
  .chip-pink { background: rgba(142, 19, 71, .45); color: var(--pink); }
  .chip-violet { background: rgba(96, 80, 209, .25); color: var(--violet-soft); }
  .chip-green { background: rgba(61, 220, 132, .14); color: var(--green); }
  .chip-red { background: rgba(255, 90, 82, .15); color: var(--red); }
  .chip-amber { background: rgba(255, 176, 32, .15); color: var(--amber); }
  .tile-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; }
  .t-pink { background: rgba(142, 19, 71, .4); color: var(--pink); }
  .t-violet { background: rgba(96, 80, 209, .25); color: var(--violet-soft); }
  .t-lime { background: rgba(198, 243, 56, .14); color: var(--lime); }
  .t-red { background: rgba(255, 90, 82, .15); color: var(--red); }
  .t-grey { background: var(--s3); color: var(--mut); }

  .btn { height: 48px; padding: 0 18px; border-radius: var(--r); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14.5px; background: var(--s3); color: var(--fg); transition: filter .15s, transform .1s; text-decoration: none; white-space: nowrap; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn-lg { height: 56px; font-size: 15.5px; }
  .btn-sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn-block { width: 100%; }
  .btn-lime { background: var(--lime); color: var(--ink); box-shadow: 0 6px 22px rgba(198, 243, 56, .22); }
  .btn-violet { background: var(--violet); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--s4); }
  .btn-wa { background: var(--wa); color: #04220f; }
  .link { color: var(--lime); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }

  .switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; border-radius: 99px; background: var(--s4); transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--mut); transition: transform .2s, background .2s; }
  .switch[aria-checked="true"] { background: var(--lime); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--mut); }
  .input { height: 48px; width: 100%; border-radius: var(--r); background: var(--s2); border: 1px solid var(--s4); padding: 0 14px; outline: none; }
  .input:focus { border-color: var(--lime); }
  .input.err { border-color: var(--red); }
  .err-msg { color: var(--red); font-size: 12.5px; font-weight: 500; }
  .seg { display: flex; background: var(--s2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; height: 38px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--mut); }
  .seg button.on { background: var(--s4); color: var(--fg); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kv { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kv b { font-size: 14px; }

  /* ---------- Home ---------- */
  .hello h2 { font-size: 21px; }
  .earn { background: var(--lime); color: #3b4d00; }
  .earn .big { font: 700 36px/1.05 var(--display); color: var(--ink); letter-spacing: -0.03em; }
  .earn .sub { background: rgba(22, 31, 0, .08); border-radius: var(--r); padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 13px; color: var(--ink); }
  .earn .chip { background: rgba(22, 31, 0, .12); color: var(--ink); }
  .glow { position: absolute; border-radius: 50%; filter: blur(34px); pointer-events: none; }
  .mission-strip { background: linear-gradient(120deg, rgba(96, 80, 209, .35), rgba(142, 19, 71, .3)); border: 1px solid rgba(199, 191, 255, .25); }
  .mapbox { position: relative; border-radius: var(--r); overflow: hidden; background: #0d0f16; }
  .mapbox > svg { display: block; width: 100%; height: 100%; }
  .map-over { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .map-over > * { pointer-events: auto; }
  .pill-glass { background: rgba(14, 14, 17, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .home-grid { display: grid; gap: 14px; }
  .empty { text-align: center; padding: 26px 16px; color: var(--mut); display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* ---------- Offer / mission ---------- */
  .split { display: flex; flex-direction: column; gap: 14px; }
  .split-map { height: 260px; margin: -16px -16px 0; border-radius: 0; }
  .split-body { margin-top: -34px; position: relative; z-index: 2; background: var(--s1); border-radius: 24px 24px var(--r-lg) var(--r-lg); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .handle { width: 44px; height: 4px; border-radius: 99px; background: var(--s4); margin: -6px auto 0; }
  .timer { position: relative; width: 48px; height: 48px; display: grid; place-items: center; flex: 0 0 auto; }
  .timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .timer span { font: 700 13px var(--display); }
  .legs { display: flex; flex-direction: column; }
  .leg { display: flex; gap: 12px; }
  .leg-rail { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .leg-dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
  .leg-line { width: 2px; flex: 1; min-height: 22px; background: var(--s4); margin: 4px 0; }
  .leg-body { flex: 1; min-width: 0; padding-bottom: 12px; }
  .money { font: 700 30px/1.1 var(--display); letter-spacing: -0.02em; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .step { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ''; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--s4); }
  .step:last-child::before { display: none; }
  .step.done::before { background: var(--lime); }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: var(--s3); color: var(--dim); position: relative; z-index: 1; }
  .step.done .step-dot { background: var(--lime); color: var(--ink); }
  .step.now .step-dot { background: var(--pink-deep); color: var(--pink); box-shadow: 0 0 0 5px rgba(255, 177, 197, .14); }
  .step.now .step-t { color: var(--pink); }
  .step-t { font-weight: 700; }
  .pins { display: flex; gap: 10px; }
  .pins input { flex: 1; min-width: 0; height: 60px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--s4); text-align: center; font: 700 28px var(--display); color: var(--fg); outline: none; caret-color: var(--lime); }
  .pins input:focus { border-color: var(--lime); }
  .pins.bad input { border-color: var(--red); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .summary-hero { text-align: center; padding: 28px 16px; }
  .summary-hero .money { font-size: 40px; color: var(--lime); }
  .check-big { width: 64px; height: 64px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; margin: 0 auto 12px; }

  /* ---------- Lists ---------- */
  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--s1); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .stat b { font: 700 20px var(--display); }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .filters button { height: 34px; padding: 0 14px; border-radius: 99px; background: var(--s2); font-weight: 700; font-size: 13px; color: var(--mut); white-space: nowrap; }
  .filters button.on { background: var(--fg); color: var(--bg); }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
    max-height: 90vh; overflow-y: auto;
    background: var(--s1); border-radius: 24px 24px 0 0;
    padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    display: flex; flex-direction: column; gap: 14px;
  }
  .sheet.open { transform: none; }
  .sheet h2 { font-size: 20px; }
  .opt-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--s2); border: 1px solid transparent; width: 100%; text-align: left; }
  .opt-row.sel { border-color: var(--lime); background: rgba(198, 243, 56, .06); }
  .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--s4); display: grid; place-items: center; flex: 0 0 auto; color: var(--ink); }
  .opt-row.sel .tick { background: var(--lime); border-color: var(--lime); }
  .opt-row:not(.sel) .tick svg { display: none; }
  .linkbox { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); border: 1px dashed var(--s4); background: var(--bg); font-size: 12.5px; }
  .linkbox code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--violet-soft); user-select: all; }

  /* ---------- Toast & offer banner ---------- */
  .toast { position: fixed; left: 50%; top: 0; z-index: 90; transform: translate(-50%, -120%); transition: transform .3s; max-width: min(92vw, 460px); background: var(--fg); color: var(--bg); border-radius: 14px; padding: 11px 16px; font-weight: 700; font-size: 13.5px; box-shadow: 0 12px 34px rgba(0, 0, 0, .45); text-align: center; }
  .toast.show { transform: translate(-50%, calc(12px + env(safe-area-inset-top, 0px))); }
  .obanner { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translateX(-50%); width: min(94vw, 460px); background: var(--s2); border: 1px solid rgba(198, 243, 56, .35); border-radius: 16px; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- Drive mode ---------- */
  .drive { position: fixed; inset: 0; z-index: 50; background: #07080d; display: flex; flex-direction: column; overflow: hidden; }
  .d-left { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .d-map { position: absolute; inset: 0; perspective: 900px; }
  .d-map-in { position: absolute; inset: -8%; transition: transform .6s ease; transform-origin: 50% 70%; }
  .d-map.tilt .d-map-in { transform: rotateX(38deg) scale(1.25); }
  .d-map svg { width: 100%; height: 100%; display: block; }
  .d-top { position: relative; z-index: 3; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  .man { background: rgba(14, 14, 17, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; gap: 12px; }
  .man-ic { width: 62px; height: 62px; border-radius: 16px; background: var(--lime); color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; box-shadow: 0 0 24px rgba(198, 243, 56, .35); }
  .man-d { font: 700 28px/1 var(--display); letter-spacing: -0.02em; }
  .man-t { font-weight: 700; font-size: 16px; margin-top: 4px; }
  .d-pills { display: flex; justify-content: space-between; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 99px; background: rgba(14, 14, 17, .9); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); animation: pk 1.4s infinite; }
  .pill.off .pdot { background: var(--dim); animation: none; }
  .pill.off { color: var(--dim); }
  @keyframes pk { 0% { box-shadow: 0 0 0 0 rgba(255, 177, 197, .7); } 70% { box-shadow: 0 0 0 8px rgba(255, 177, 197, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 177, 197, 0); } }
  .d-mid { position: relative; z-index: 3; flex: 1; min-height: 120px; }
  .speedo { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; }
  .gauge { width: 100px; height: 100px; border-radius: 50%; background: rgba(10, 10, 14, .9); border: 1px solid var(--line); position: relative; display: grid; place-items: center; }
  .gauge svg { position: absolute; inset: 0; }
  .gauge b { font: 700 34px/1 var(--display); display: block; text-align: center; }
  .gauge small { display: block; text-align: center; font-size: 10px; letter-spacing: .15em; color: var(--dim); }
  .limit { width: 52px; height: 52px; border-radius: 50%; background: #fff; border: 6px solid #e53935; color: #111; display: grid; place-items: center; font: 700 17px var(--display); }
  .fabs { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  .fab { width: 46px; height: 46px; border-radius: 14px; background: rgba(14, 14, 17, .92); border: 1px solid var(--line); display: grid; place-items: center; }
  .fab.on { background: var(--lime); color: var(--ink); }
  .fab-txt { font: 700 13px var(--display); }
  .traffic-chip { position: absolute; left: 12px; bottom: 124px; }
  .cockpit { position: relative; z-index: 4; background: linear-gradient(180deg, rgba(23, 23, 27, .97), #111114); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .metrics b { font: 700 21px var(--display); display: block; }
  .bar { height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--lime)); }
  .qa-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .qa { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 2px; min-height: 68px; border-radius: 14px; background: var(--s2); font-size: 11px; font-weight: 700; text-align: center; }
  .qa.on { background: rgba(198, 243, 56, .12); color: var(--lime); box-shadow: inset 0 0 0 1px rgba(198, 243, 56, .5); }
  .qa.sos { background: var(--red); color: #fff; }
  .share-live { border-radius: 14px; padding: 10px 12px; background: rgba(61, 220, 132, .08); border: 1px solid rgba(61, 220, 132, .35); display: flex; flex-direction: column; gap: 6px; }

    const make = (bridge) => {

      if (bridge) {

      } else {
        pts.push({ x: b.x, y: a.y, label: 'Direction ' + (b.short || b.name) });
      }
      pts.push(end);
      // nettoyage des points trop proches
      const clean = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        if (dist(clean[clean.length - 1], pts[i]) > 6 || i === pts.length - 1) clean.push(pts[i]);

      return { pts: clean, bridge: bridge ? bridge.id : null, toll: bridge ? bridge.toll : 0, len: polyLen(clean) };

    if (side(a) === side(b)) return finish(make(null));
    const options = (avoidToll ? [BRIDGES.dg] : [BRIDGES.hkb, BRIDGES.dg]).map(make);

    function finish(r) { r.km = +(r.len * M_PER_UNIT / 1000).toFixed(1); r.min = Math.max(2, Math.round(r.km / 27 * 60)); return r; }
  }

  function pointAt(pts, d) {

    for (let i = 1; i < pts.length; i++) {

      return { fare, net, toll: trip.toll };

  const KEY = 'vela-chauffeur-v2';
  function load() {

      return s && s.v === 2 ? s : null;
    } catch (e) { return null; }
  }
  let S = load() || seed();
  let saveT = 0;
  function save(now) {
    clearTimeout(saveT);
    const run = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ } };
    if (now) run(); else saveT = setTimeout(run, 250);

  // Une offre sauvegardée a forcément expiré entre deux visites

  const $ = (id) => document.getElementById(id);

  /* ---------- Toast ---------- */
  let toastT;
  function toast(msg) {

  /* ---------- Voix ---------- */
  function speak(text) {
    if (!S.voice) return;

      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 1.02;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) { /* voix indisponible */ }
  }

  /* =========================================================
     Données dérivées
     ========================================================= */
  function todayStats() {
    const today = S.history.filter((h) => isToday(h.t));
    const done = today.filter((h) => h.status === 'done');
    const answered = today.filter((h) => h.status === 'done' || h.status === 'declined' || h.status === 'expired' || h.status === 'cancelled');
    return {
      earn: done.reduce((s, h) => s + h.amount, 0),
      city: done.filter((h) => h.type === 'city').length,
      taxi: done.filter((h) => h.type === 'taxi').length,
      rate: answered.length ? Math.round(done.length / answered.length * 100) : 100,
      count: done.length
    };
  }
  const unread = () => S.notifs.filter((n) => !n.read).length;

  /* =========================================================
     Offres
     ========================================================= */
  function makeOffer(type) {
    const here = S.pos;
    const near = PLACES.filter((p) => dist(p, here) > 30).sort((a, b) => dist(a, here) - dist(b, here)).slice(0, 4);
    const pickup = pick(near);
    const far = PLACES.filter((p) => p.id !== pickup.id && dist(p, pickup) > 90);
    const drop = pick(far);
    const approach = buildRoute(here, pickup, false);
    const trip = buildRoute(pickup, drop, false);
    const surge = type === 'taxi' && ['ambassades', 'plateau', 'ccia', 'riviera2'].includes(pickup.id) ? 1.3 : 1;
    const price = priceOffer(type, approach, trip, surge);
    const cust = Object.assign({}, pick(type === 'taxi' ? CUSTOMERS_TAXI : CUSTOMERS_CITY));
    return {
      id: 'CP-' + (20400 + Math.floor(Math.random() * 600)),
      type, pickupId: pickup.id, dropId: drop.id, surge,
      approachKm: approach.km, approachMin: approach.min, tripKm: trip.km, tripMin: trip.min, bridge: trip.bridge,
      fare: price.fare, net: price.net, toll: price.toll,
      customer: cust,
      code: String(1000 + Math.floor(Math.random() * 9000)),
      createdAt: Date.now(), ttl: type === 'taxi' ? 25 : 30
    };
  }
  function enabledTypes() { return ['city', 'taxi'].filter((t) => S.services[t]); }
  function canReceive() { return S.online && !S.mission && !S.offer && enabledTypes().length > 0; }

  function pushOffer(type) {
    if (!canReceive()) return false;
    type = type && S.services[type] ? type : pick(enabledTypes());
    S.offer = makeOffer(type);
    notify((type === 'taxi' ? 'Nouvelle course Vela · ' : 'Nouvelle livraison City+ · ') + placeById(S.offer.pickupId).short + ' → ' + placeById(S.offer.dropId).short);
    speak(type === 'taxi' ? 'Nouvelle course disponible' : 'Nouvelle livraison City+ disponible');
    save();
    renderChrome();
    if (ui.view === 'home' || ui.view === 'missions') render();
    return true;
  }

  function requestOffer(type) {
    if (S.mission) { go('mission'); return; }
    if (S.offer) { if (!type || S.offer.type === type) { go('offer'); return; } }
    if (!S.online) { toast('Passez en ligne pour recevoir des offres'); return; }
    if (!S.services[type]) { toast('Activez « ' + (type === 'taxi' ? 'Courses Vela Taxi' : 'Livraisons City+') + ' » dans votre profil'); return; }
    if (S.offer) { toast('Répondez d\'abord à l\'offre en cours'); go('offer'); return; }
    ui.searching = type;
    render();
    setTimeout(() => {
      ui.searching = null;
      if (pushOffer(type)) go('offer'); else render();
    }, 1400);
  }

  function closeOffer(status) {
    const o = S.offer;
    if (!o) return;
    S.history.unshift({ id: uid(), type: o.type, from: placeById(o.pickupId).short, to: placeById(o.dropId).short, amount: 0, status, t: Date.now() });
    S.offer = null;
    ui.nextOfferAt = Date.now() + 12000 + Math.random() * 8000;
    save();
  }

  /* =========================================================
     Missions
     ========================================================= */
  const PHASES = ['to_pickup', 'at_pickup', 'to_drop', 'at_drop', 'done'];
  function acceptOffer() {
    const o = S.offer;
    if (!o) return;
    const pickup = placeById(o.pickupId);
    S.mission = Object.assign({}, o, { phase: 'to_pickup', acceptedAt: Date.now(), avoidToll: false, leg: null, traveled: 0, events: [{ t: Date.now(), label: 'Mission acceptée' }], waitStart: 0, incidents: [] });
    S.mission.leg = buildRoute(S.pos, pickup, false);
    S.offer = null;
    notify((o.type === 'taxi' ? 'Course ' : 'Livraison ') + o.id + ' acceptée');
    save();
    toast(o.type === 'taxi' ? 'Course acceptée · ' + o.customer.name + ' vous attend' : 'Livraison ' + o.id + ' assignée');
    speak('Mission acceptée. Direction ' + pickup.short);
    ui.stack = ['home'];
    go('mission', true);
  }

  function missionTarget(m) { return placeById(m.phase === 'to_pickup' || m.phase === 'at_pickup' ? m.pickupId : m.dropId); }

  function advance() {
    const m = S.mission;
    if (!m) return;
    if (m.phase === 'at_pickup') {
      m.phase = 'to_drop';
      m.traveled = 0;
      m.leg = buildRoute(placeById(m.pickupId), placeById(m.dropId), m.avoidToll);
      m.events.push({ t: Date.now(), label: m.type === 'taxi' ? 'Passager à bord' : 'Colis récupéré' });
      toast(m.type === 'taxi' ? 'Bonne route avec ' + m.customer.name : 'Colis récupéré · direction ' + placeById(m.dropId).short);
      save();
      render();
    }
  }

  function arrive() {
    const m = S.mission;
    if (!m) return;
    const target = missionTarget(m);
    S.pos = { x: target.x, y: target.y };
    if (m.phase === 'to_pickup') {
      m.phase = 'at_pickup';
      m.waitStart = Date.now();
      m.events.push({ t: Date.now(), label: 'Arrivé à ' + target.short });
      speak('Vous êtes arrivé. ' + (m.type === 'taxi' ? 'Votre passager vous attend.' : 'Récupérez le colis.'));
    } else if (m.phase === 'to_drop') {
      m.phase = 'at_drop';
      m.events.push({ t: Date.now(), label: 'Arrivé à destination' });
      speak('Vous êtes arrivé à destination.');
    }
    notify('Arrivé à ' + target.short);
    save();
  }

  function complete() {
    const m = S.mission;
    if (!m) return;
    m.phase = 'done';
    m.doneAt = Date.now();
    m.events.push({ t: Date.now(), label: m.type === 'taxi' ? 'Course terminée' : 'Colis remis' });
    const from = placeById(m.pickupId).short, to = placeById(m.dropId).short;
    S.history.unshift({ id: uid(), type: m.type, from, to, amount: m.net, status: 'done', t: Date.now() });
    S.vm += m.net;
    S.tx.unshift({ id: uid(), label: (m.type === 'taxi' ? 'Course Vela · ' : 'Livraison City+ · ') + from + ' → ' + to, amount: m.net, unit: 'VM', t: Date.now() });
    notify('+' + fmt(m.net) + ' VM crédités · ' + from + ' → ' + to);
    if (S.share.active) stopShare(true);
    if (S.sos) S.sos = false;
    speak('Mission terminée. ' + fmt(m.net) + ' Vela Monnaie crédités.');
    save();
  }

  function finishMission() {
    S.mission = null;
    ui.nextOfferAt = Date.now() + 9000;
    ui.pinTries = 0;
    save();
    ui.stack = [];
    go('home', true);
  }

  function cancelMission(reason) {
    const m = S.mission;
    if (!m) return;
    S.history.unshift({ id: uid(), type: m.type, from: placeById(m.pickupId).short, to: placeById(m.dropId).short, amount: 0, status: 'cancelled', reason, t: Date.now() });
    notify('Mission ' + m.id + ' annulée · ' + reason);

  /* =========================================================

  const shareUrl = () => 'https://vela.ci/suivi/' + S.share.token;
  function shareMessage() {
    const m = S.mission;
    const dest = m ? missionTarget(m).name : 'ma destination';

  function startShare() {
    const ids = S.share.with.filter((id) => S.contacts.some((c) => c.id === id));
    if (!ids.length) { toast('Choisissez au moins un proche'); return false; }
    const was = S.share.active;
    S.share.with = ids;
    if (!S.share.token) S.share.token = uid() + uid().slice(0, 4);
    if (!was) S.share.startedAt = Date.now();

  /* =========================================================

     ========================================================= */
  const TITLES = { home: 'Accueil', offer: 'Nouvelle offre', mission: 'Mission en cours', missions: 'Missions', wallet: 'Portefeuille', profile: 'Profil' };
  const ROOTS = ['home', 'missions', 'wallet', 'profile'];
  function go(view, replace) {
    if (view === 'offer' && !S.offer) view = 'home';

  /* =========================================================

  const NAV = [

    const root = ROOTS.includes(ui.view) ? ui.view : (ui.stack.find((v) => ROOTS.includes(v)) || 'home');
    const pending = (S.offer ? 1 : 0) + (S.mission ? 1 : 0);

    $('sideNav').innerHTML = NAV.map((n) => '<button class="side-link' + (n.v === root ? ' on' : '') + '" data-action="go" data-view="' + n.v + '">' + ic(n.icon, 20) + n.label + (n.v === 'missions' && pending ? '<span class="badge-dot">' + pending + '</span>' : '') + '</button>').join('');
    const st = todayStats();
    $('sideFoot').innerHTML = '<div class="between"><span class="row"><span class="status-dot' + (S.online ? ' on' : '') + '"></span><b>' + (S.online ? 'En ligne' : 'Hors ligne') + '</b></span><button class="switch" role="switch" aria-label="Disponibilité" aria-checked="' + S.online + '" data-action="toggle-online"></button></div><div class="small muted">Aujourd\'hui : <b style="color:var(--fg)">' + fmt(st.earn) + ' FCFA</b></div>';

  function offerLeft() { return S.offer ? Math.max(0, Math.ceil(S.offer.ttl - (Date.now() - S.offer.createdAt) / 1000)) : 0; }

  function renderBanner() {

  function render() {
    renderChrome();
    const v = ui.view;
    const html = v === 'home' ? viewHome() : v === 'offer' ? viewOffer() : v === 'mission' ? viewMission() : v === 'missions' ? viewMissions() : v === 'wallet' ? viewWallet() : viewProfile();
    $('view').innerHTML = html;
    if (v === 'mission' && S.mission && S.mission.phase === 'at_drop' && S.mission.type === 'city') {
      const first = document.querySelector('.pins input:not([value])') || document.querySelector('.pins input');
      if (first && window.innerWidth >= 720) first.focus();
    }
  }

  function statusCard() {
    const lockNote = S.mission ? 'Mission en cours · statut verrouillé' : S.online ? (enabledTypes().length ? 'Prêt pour nouvelles courses' : 'Aucun service activé dans le profil') : 'Vous ne recevez plus d\'offres';
    return '<div class="card" style="padding:10px 12px"><div class="between">' +
      '<div class="row grow"><button class="switch" role="switch" aria-label="Disponibilité" aria-checked="' + S.online + '" data-action="toggle-online"></button>' +
      '<div class="grow"><b>' + (S.online ? 'En ligne' : 'Hors ligne') + '</b><div class="tiny muted trunc">' + lockNote + '</div></div></div>' +
      '<span class="chip">' + ic('pin', 14) + esc(nearestPlace().short) + '</span></div></div>';
  }
  function nearestPlace() { return PLACES.slice().sort((a, b) => dist(a, S.pos) - dist(b, S.pos))[0]; }

  function missionStrip() {
    const m = S.mission;
    if (!m) return '';
    const t = missionTarget(m);
    const labels = { to_pickup: 'En route vers ' + (m.type === 'taxi' ? 'la prise en charge' : 'la collecte'), at_pickup: m.type === 'taxi' ? 'Sur place · passager attendu' : 'Sur place · récupérez le colis', to_drop: 'En route vers ' + (m.type === 'taxi' ? 'la destination' : 'la cliente'), at_drop: m.type === 'taxi' ? 'Arrivé · terminez la course' : 'Arrivé · code de remise', done: 'Terminée' };
    return '<div class="card mission-strip span-3 span-2"><div class="between">' +
      '<div class="row grow"><span class="tile-ic t-violet">' + ic(m.type === 'taxi' ? 'taxi' : 'bag', 18) + '</span><div class="grow"><div class="label" style="color:var(--violet-soft)">Mission ' + m.id + '</div><b class="trunc" style="display:block">' + labels[m.phase] + '</b><span class="small muted trunc" style="display:block">' + esc(t.name) + '</span></div></div>' +
      '<button class="btn btn-lime btn-sm" data-action="go" data-view="mission">Reprendre</button></div></div>';
  }

    const st = todayStats();
    const o = S.offer;
    const searching = ui.searching;
    const cityBtn = searching === 'city' ? '<button class="btn btn-block" disabled>' + ic('refresh', 16) + 'Recherche de missions…</button>' :
      '<button class="btn btn-block" data-action="request" data-type="city">' + (o && o.type === 'city' ? 'Voir l\'offre en attente' : S.mission && S.mission.type === 'city' ? 'Voir la mission en cours' : 'Voir les missions') + ic('arrow', 16, ' style="color:var(--pink)"') + '</button>';
    const taxiBtn = searching === 'taxi' ? '<button class="btn btn-block" disabled>' + ic('radar', 16) + 'Balayage du radar…</button>' :
      '<button class="btn btn-block" data-action="request" data-type="taxi">' + (o && o.type === 'taxi' ? 'Voir l\'offre en attente' : S.mission && S.mission.type === 'taxi' ? 'Voir la course en cours' : 'Ouvrir le radar des courses') + ic('radar', 16, ' style="color:var(--lime)"') + '</button>';
    return '<div class="stack">' +
      '<div class="between hello"><div class="row" style="min-width:0"><div style="position:relative"><div class="avatar av-driver" style="width:48px;height:48px;font-size:16px">KT</div></div>' +
      '<div style="min-width:0"><h2 class="trunc">' + greeting() + ', ' + esc(S.driver.first) + '</h2><p class="small muted trunc">City Drive · Chauffeur-livreur · ' + icFill('star', 12).replace('class="ic"', 'class="ic" style="display:inline;vertical-align:-1px;color:var(--lime)"') + ' ' + S.driver.rating + '</p></div></div></div>' +
      '<div class="home-grid">' +
        missionStrip() +
        '<div class="span-3 span-2" style="grid-column:1/-1">' + statusCard() + '</div>' +
        '<div class="card earn"><div class="glow" style="right:-30px;bottom:-30px;width:130px;height:130px;background:rgba(85,109,0,.25)"></div>' +
          '<div class="between"><span class="label" style="color:#3b4d00">Gains aujourd\'hui</span><span class="chip">' + ic('trend', 14) + st.rate + '% d\'acceptation</span></div>' +
          '<div class="row" style="align-items:baseline;gap:6px"><span class="big">' + fmt(st.earn) + '</span><b>FCFA</b></div>' +
          '<div class="sub"><span class="row" style="gap:6px">' + ic('bag', 16) + st.city + ' livraisons City+</span><span class="row" style="gap:6px">' + ic('taxi', 16) + st.taxi + ' courses Vela</span></div></div>' +
        '<div class="card"><div class="glow" style="right:-40px;top:-40px;width:160px;height:160px;background:rgba(96,80,209,.2)"></div>' +
          '<div class="between"><span class="chip chip-violet">' + ic('swap', 14) + 'Compte Vela lié</span><button class="link" data-action="go" data-view="wallet" style="color:var(--violet-soft)">Convertir' + ic('arrow', 14) + '</button></div>' +
          '<div><span class="small muted">Solde disponible</span><div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-size:28px">' + fmt(S.vm) + '</span><b style="color:var(--violet-soft)">VM</b></div></div>' +
          '<div class="inset row small muted">' + ic('wallet', 18, ' style="color:var(--violet-soft)"') + '1 VM = 1 FCFA · conversion sans frais vers Mobile Money</div></div>' +
        '<div class="card"><div class="between"><div class="row"><span class="tile-ic t-pink">' + ic('bag', 18) + '</span><div><h3 style="font-size:16px">Livraisons City+</h3><span class="small muted">Mode &amp; colis express</span></div></div>' +
          (o && o.type === 'city' ? '<span class="chip chip-pink">1 en attente</span>' : S.services.city ? '<span class="chip">Actif</span>' : '<span class="chip">Désactivé</span>') + '</div>' +
          '<div class="inset row">' + ic('store', 18, ' style="color:var(--pink)"') + '<div class="grow"><div class="label">Point relais assigné</div><b class="small trunc" style="display:block">Angré 8e Tranche · Boutique N°14</b></div></div>' + cityBtn + '</div>' +
        '<div class="card"><div class="between"><div class="row"><span class="tile-ic t-violet">' + ic('taxi', 18) + '</span><div><h3 style="font-size:16px">Courses taxi Vela</h3><span class="small muted">Forte demande active</span></div></div><span class="chip chip-lime">x1.3 Surge</span></div>' +
          '<div class="inset between"><div class="row grow">' + ic('fire', 18, ' style="color:var(--lime)"') + '<div class="grow"><div class="label">Hotspots identifiés</div><b class="small trunc" style="display:block">Cocody Ambassades &amp; Plateau</b></div></div><span class="small" style="color:var(--lime);font-weight:700">x1.3 tarif</span></div>' + taxiBtn + '</div>' +
        '<div class="card span-2"><div class="between"><div class="row">' + ic('map', 20, ' style="color:var(--mut)"') + '<h3 style="font-size:16px">Zones à forte affluence</h3></div><span class="tiny muted">Mis à jour ' + hm(Date.now()) + '</span></div>' +
          '<div class="mapbox" style="height:220px">' + mapSVG({ id: 'home', heat: true, viewBox: '60 40 320 300', car: { x: S.pos.x, y: S.pos.y, deg: -90 }, carId: 'homecar', traffic: true }) +
          '<div class="map-over" style="bottom:10px"><span class="pill-glass"><span class="status-dot on" style="width:8px;height:8px"></span>Affluence max : Bd Latrille (Angré)</span><span class="pill-glass">' + ic('pin', 14) + 'Vous · ' + esc(nearestPlace().short) + '</span></div></div></div>' +
      '</div></div>';
  }
  function greeting() { const h = new Date().getHours(); return h < 5 ? 'Bonne nuit' : h < 18 ? 'Bonjour' : 'Bonsoir'; }

  function offerMap(o, legPts, pts2) {
    const pickup = placeById(o.pickupId), drop = placeById(o.dropId);
    const all = (legPts || []).concat(pts2 || []);
    const xs = all.map((p) => p.x), ys = all.map((p) => p.y);
    const minX = Math.min.apply(null, xs) - 70, maxX = Math.max.apply(null, xs) + 70, minY = Math.min.apply(null, ys) - 60, maxY = Math.max.apply(null, ys) + 60;
    let w = maxX - minX, h = maxY - minY;
    const vb = minX + ' ' + minY + ' ' + w + ' ' + h;
    return mapSVG({ id: 'of', fit: true, viewBox: vb, route: pts2, route2: legPts, markers: [{ x: pickup.x, y: pickup.y, kind: 'pickup', label: pickup.short }, { x: drop.x, y: drop.y, kind: 'drop', label: drop.short }], car: { x: S.pos.x, y: S.pos.y, deg: -90 }, carId: 'ofcar', traffic: true });
  }

  function viewOffer() {
    const o = S.offer;
    if (!o) return viewHome();
    const pickup = placeById(o.pickupId), drop = placeById(o.dropId);
    const trip = buildRoute(pickup, drop, false);
    const approach = buildRoute(S.pos, pickup, false);
    const left = offerLeft();
    const c = o.customer;
    const isTaxi = o.type === 'taxi';
    return '<div class="split">' +
      '<div class="mapbox split-map">' + offerMap(o, approach.pts, trip.pts) +
        '<div class="map-over" style="top:12px"><span class="pill-glass"><span class="status-dot on" style="width:8px;height:8px"></span>' + (trip.bridge === 'hkb' ? 'Trafic fluide Pont HKB' : trip.bridge === 'dg' ? 'Pont De Gaulle · ralenti' : 'Trafic fluide') + '</span><span class="pill-glass">' + esc(pickup.short) + ' · ' + o.approachMin + ' min</span></div></div>' +
      '<div class="split-body"><div class="handle"></div>' +
        '<div class="between"><span class="chip ' + (isTaxi ? 'chip-violet' : 'chip-pink') + '">' + ic(isTaxi ? 'taxi' : 'bag', 14) + (isTaxi ? 'Nouvelle course · Vela Taxi' : 'Nouvelle livraison · City+') + '</span>' +
          '<div class="timer" aria-label="Temps restant"><svg viewBox="0 0 36 36" width="48" height="48"><circle cx="18" cy="18" r="15" fill="none" stroke="#2a2a30" stroke-width="3"/><circle data-offer-ring cx="18" cy="18" r="15" fill="none" stroke="#c6f338" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="' + (left / o.ttl * 100).toFixed(1) + ' 100"/></svg><span data-offer-left-s>' + left + 's</span></div></div>' +
        '<div class="between" style="align-items:flex-end"><div><div class="label">' + (isTaxi ? 'Vous recevez' : 'Rémunération nette') + '</div><div class="money" style="color:var(--lime)">+' + fmt(o.net) + ' <span style="font-size:16px">FCFA</span></div>' +
          (isTaxi ? '<div class="tiny muted">Tarif client ' + fmt(o.fare) + ' F' + (o.surge > 1 ? ' · surge x' + o.surge : '') + (o.toll ? ' · péage ' + o.toll + ' F remboursé' : '') + '</div>' : '<div class="tiny muted">Commande déjà réglée sur City+</div>') + '</div>' +
          '<div style="text-align:right"><div class="label">Estimation</div><b>' + (o.approachMin + o.tripMin) + ' min · ' + (o.approachKm + o.tripKm).toFixed(1) + ' km</b></div></div>' +
        '<div class="inset between"><div class="row grow"><div class="avatar" style="width:42px;height:42px;background:' + (isTaxi ? 'linear-gradient(135deg,#6050d1,#c7bfff);color:#170065' : 'linear-gradient(135deg,#ffb1c5,#8e1347);color:#fff') + '">' + initials(c.name) + '</div>' +
          '<div class="grow"><b class="trunc" style="display:block">' + esc(c.name) + '</b><span class="small muted">' + icFill('star', 12).replace('class="ic"', 'class="ic" style="display:inline;vertical-align:-1px;color:var(--lime)"') + ' ' + c.rating + ' · ' + c.rides + (isTaxi ? ' courses' : ' commandes') + '</span></div></div>' +
          (c.vip ? '<span class="chip">' + ic('shield', 14, ' style="color:var(--lime)"') + 'Client VIP</span>' : '') + '</div>' +
        '<div class="inset legs" style="padding:14px">' +
          legRow('var(--lime)', isTaxi ? 'Prise en charge' : 'Collecte magasin', o.approachKm + ' km · ' + o.approachMin + ' min', pickup.name, isTaxi ? pickup.detail : (c.shop || pickup.detail), true) +
          legRow('var(--violet-soft)', isTaxi ? 'Destination' : 'Livraison client', o.tripKm + ' km · ' + o.tripMin + ' min', drop.name, drop.detail, false) + '</div>' +
        (isTaxi ? '<div class="inset row">' + ic('wallet', 20, ' style="color:var(--violet-soft)"') + '<div class="grow small"><b>Paiement Vela Monnaie</b><div class="muted">Versement instantané sur votre portefeuille. Aucune manipulation d\'espèces.</div></div></div>'
          : '<div class="grid-2"><div class="inset kv"><span class="label">Contenu</span><b class="trunc">' + esc(c.items) + '</b></div><div class="inset kv"><span class="label">Charge</span><b class="trunc">' + esc(c.weight) + '</b></div></div>') +
        '<div class="row"><button class="btn btn-lg" style="width:120px" data-action="decline">' + (isTaxi ? 'Passer' : 'Refuser') + '</button><button class="btn btn-lime btn-lg grow" data-action="accept">' + ic(isTaxi ? 'checkc' : 'bolt', 20) + (isTaxi ? 'Accepter la course' : 'Accepter la livraison') + '</button></div>' +
      '</div></div>';
  }
  function legRow(color, label, meta, title, sub, line) {
    return '<div class="leg"><div class="leg-rail"><span class="leg-dot" style="background:' + color + '"></span>' + (line ? '<span class="leg-line"></span>' : '') + '</div>' +
      '<div class="leg-body"><div class="between"><span class="label" style="color:' + color + '">' + label + '</span><span class="tiny muted">' + meta + '</span></div><b class="trunc" style="display:block">' + esc(title) + '</b><span class="small muted trunc" style="display:block">' + esc(sub) + '</span></div></div>';
  }

  function viewMission() {
    const m = S.mission;
    if (!m) return viewHome();
    const isTaxi = m.type === 'taxi';
    const pickup = placeById(m.pickupId), drop = placeById(m.dropId);
    const c = m.customer;
    if (m.phase === 'done') {
      return '<div class="stack" style="max-width:560px;margin:0 auto"><div class="card summary-hero"><div class="check-big">' + ic('check', 34) + '</div>' +
        '<h2>' + (isTaxi ? 'Course terminée' : 'Livraison confirmée') + '</h2><p class="muted" style="margin-top:4px">' + esc(pickup.short) + ' → ' + esc(drop.short) + ' · ' + m.tripKm + ' km</p>' +
        '<div class="money" style="margin-top:14px">+' + fmt(m.net) + ' VM</div><p class="small muted">Crédités instantanément sur votre portefeuille Vela</p></div>' +
        '<div class="card"><div class="between"><span class="muted">Nouveau solde</span><b>' + fmt(S.vm) + ' VM</b></div><div class="between"><span class="muted">Gains du jour</span><b>' + fmt(todayStats().earn) + ' FCFA</b></div>' +
        (m.toll ? '<div class="between"><span class="muted">Péage HKB remboursé</span><b>' + m.toll + ' F</b></div>' : '') + '</div>' +
        '<button class="btn btn-lime btn-lg btn-block" data-action="finish">' + ic('home', 20) + 'Retour à l\'accueil</button></div>';
    }
    const target = missionTarget(m);
    const leg = m.leg;
    const phaseIdx = PHASES.indexOf(m.phase);
    const remain = leg ? Math.max(0, (leg.len - m.traveled) * M_PER_UNIT / 1000) : 0;
    const remainMin = Math.max(1, Math.round(remain / 27 * 60));
    const steps = [
      [isTaxi ? 'En route vers la prise en charge' : 'En route vers la collecte', pickup.name],
      [isTaxi ? 'Passager à bord' : 'Colis récupéré', isTaxi ? c.name : (c.shop || pickup.detail)],
      [isTaxi ? 'En route vers la destination' : 'En route vers la cliente', drop.name],
      [isTaxi ? 'Arrivée et paiement' : 'Remise avec code de sécurité', isTaxi ? 'Paiement Vela Monnaie' : 'Signature numérique City+']
    ];
    const stepState = (i) => {
      const map = { to_pickup: 0, at_pickup: 1, to_drop: 2, at_drop: 3 };
      const cur = map[m.phase];
      return i < cur ? 'done' : i === cur ? 'now' : '';
    };
    const evt = (label) => { const e = m.events.find((x) => x.label.indexOf(label) === 0); return e ? hm(e.t) : ''; };
    const stepTimes = [evt('Mission acceptée'), evt(isTaxi ? 'Passager' : 'Colis récupéré'), '', ''];

    let action = '';
    if (m.phase === 'to_pickup' || m.phase === 'to_drop') {
      const started = m.traveled > 0;
      action = '<button class="btn btn-lime btn-lg btn-block" data-action="drive">' + ic('nav', 20) + (started ? 'Reprendre la navigation' : 'Lancer la navigation vers ' + esc(target.short)) + '</button>';
    } else if (m.phase === 'at_pickup') {
      const waited = Math.floor((Date.now() - m.waitStart) / 1000);
      action = '<div class="inset between small"><span class="row">' + ic('clock', 16) + 'Attente sur place</span><b data-wait>' + mmss(waited) + '</b></div>' +
        '<div class="tiny muted">' + (isTaxi ? 'Attente gratuite 3 min, puis 50 F/min facturés au client.' : 'Présentez le code de mission ' + m.id + ' au comptoir.') + '</div>' +
        '<button class="btn btn-lime btn-lg btn-block" data-action="advance">' + ic('checkc', 20) + (isTaxi ? esc(c.name) + ' est à bord' : 'Colis récupéré') + '</button>';
    } else if (m.phase === 'at_drop') {
      if (isTaxi) {
        action = '<div class="inset"><div class="between"><span class="muted">Tarif client</span><b>' + fmt(m.fare) + ' F</b></div>' + (m.toll ? '<div class="between small"><span class="muted">dont péage HKB</span><span>' + m.toll + ' F</span></div>' : '') + '<div class="between"><span class="muted">Commission Vela (15 %)</span><span>−' + fmt(m.fare - m.net) + ' F</span></div><div class="between" style="margin-top:6px"><b>Vous recevez</b><b style="color:var(--lime)">' + fmt(m.net) + ' VM</b></div></div>' +
          '<button class="btn btn-lime btn-lg btn-block" data-action="complete">' + ic('checkc', 20) + 'Terminer la course</button>';
      } else {
        action = '<div class="card" style="background:var(--s2)"><div class="row">' + ic('lock', 20, ' style="color:var(--pink)"') + '<h3 style="font-size:16px">Code de confirmation client</h3></div>' +
          '<p class="small muted">Demandez le code à 4 chiffres reçu par ' + esc(c.name) + ' dans son application City+.</p>' +
          '<div class="inset small row" style="background:var(--bg)">' + ic('msg', 16, ' style="color:var(--violet-soft)"') + '<span>Démo : la cliente vous lit le code <b style="color:var(--fg);letter-spacing:.15em">' + m.code + '</b></span></div>' +
          '<div class="pins' + (ui.errors.pin ? ' bad' : '') + '" id="pins">' + [0, 1, 2, 3].map((i) => '<input id="pin' + i + '" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Chiffre ' + (i + 1) + '">').join('') + '</div>' +
          (ui.errors.pin ? '<p class="err-msg">' + ui.errors.pin + '</p>' : '') +
          '<div class="between tiny muted"><span class="row" style="gap:4px">' + ic('shield', 14, ' style="color:var(--lime)"') + 'Garantie anti-fraude active</span><button class="link" style="color:var(--pink)" data-action="code-help">Problème de code ?</button></div></div>' +
          '<button class="btn btn-lime btn-lg btn-block" id="confirmPin" data-action="check-pin" disabled>' + ic('checkc', 20) + 'Confirmer la livraison</button>' +
          '<p class="tiny muted" style="text-align:center">Crédit instantané de ' + fmt(m.net) + ' VM sur votre portefeuille Vela</p>';
      }
    }

    const mapPts = leg ? leg.pts : [];
    const car = leg ? pointAt(leg.pts, m.traveled) : S.pos;
    const markers = [{ x: pickup.x, y: pickup.y, kind: 'pickup', label: pickup.short }, { x: drop.x, y: drop.y, kind: 'drop', label: drop.short }];
    const allPts = mapPts.concat([pickup, drop]);
    const xs = allPts.map((p) => p.x), ys = allPts.map((p) => p.y);
    const vb = (Math.min.apply(null, xs) - 70) + ' ' + (Math.min.apply(null, ys) - 60) + ' ' + (Math.max.apply(null, xs) - Math.min.apply(null, xs) + 140) + ' ' + (Math.max.apply(null, ys) - Math.min.apply(null, ys) + 120);

    return '<div class="split">' +
      '<div class="mapbox split-map">' + mapSVG({ id: 'mi', fit: true, viewBox: vb, route: (m.phase === 'to_pickup' || m.phase === 'to_drop') ? mapPts : null, markers, car: { x: car.x, y: car.y, deg: (car.angle || -Math.PI / 2) * 180 / Math.PI }, carId: 'micar', incidents: m.incidents, traffic: true }) +
        '<div class="map-over" style="top:12px"><span class="pill-glass">' + ic('nav', 16, ' style="color:var(--lime)"') + (m.phase === 'to_pickup' || m.phase === 'to_drop' ? remain.toFixed(1) + ' km · ' + remainMin + ' min' : 'Sur place') + '</span>' +
        (S.share.active ? '<span class="pill-glass" style="color:var(--green)"><span class="live"></span>Trajet partagé</span>' : '') + '</div></div>' +
      '<div class="stack">' +
        '<div class="between wrap"><div class="row wrap"><span class="chip chip-pink">#' + m.id + '</span><span class="chip">' + (isTaxi ? 'Vela Taxi' : 'City+ Mode Express') + '</span></div>' +
          '<div class="row"><button class="icon-btn" style="background:var(--s2);color:var(--fg)" data-action="call" aria-label="Appeler">' + ic('phone', 20) + '</button><button class="icon-btn" style="background:var(--s2);color:var(--fg)" data-action="sms" aria-label="Message">' + ic('msg', 20) + '</button><button class="icon-btn" style="background:' + (S.share.active ? 'rgba(61,220,132,.15);color:var(--green)' : 'var(--s2);color:var(--fg)') + '" data-action="open-share" aria-label="Partager le trajet">' + ic('share', 20) + '</button></div></div>' +
        '<div class="card"><div class="between"><div class="row grow"><div class="avatar" style="width:44px;height:44px;background:' + (isTaxi ? 'linear-gradient(135deg,#6050d1,#c7bfff);color:#170065' : 'linear-gradient(135deg,#ffb1c5,#8e1347);color:#fff') + '">' + initials(c.name) + '</div>' +
          '<div class="grow"><b class="trunc" style="display:block">' + esc(c.name) + '</b><span class="small trunc" style="display:block;color:var(--pink)">' + (isTaxi ? (c.vip ? 'Client VIP · ' : '') + c.rides + ' courses' : 'Commande ' + esc(c.order)) + '</span></div></div>' +
          '<span class="chip">' + icFill('star', 13).replace('class="ic"', 'class="ic" style="color:var(--lime)"') + c.rating + '</span></div>' +

    else current = '<div class="card"><div class="empty">' + ic('radar', 32) + '<b style="color:var(--fg)">' + (S.online ? 'En attente de nouvelles offres' : 'Vous êtes hors ligne') + '</b><span class="small">' + (S.online ? 'Les offres arrivent automatiquement. Vous pouvez aussi lancer une recherche.' : 'Passez en ligne pour recevoir des offres.') + '</span>' +
      (S.online ? '<div class="row wrap" style="justify-content:center"><button class="btn btn-sm" data-action="request" data-type="city">' + ic('bag', 16) + 'Livraison City+</button><button class="btn btn-sm" data-action="request" data-type="taxi">' + ic('taxi', 16) + 'Course Vela</button></div>' : '<button class="btn btn-lime btn-sm" data-action="toggle-online">Passer en ligne</button>') + '</div></div>';

      '<div class="filters" role="tablist">' + [['all', 'Tout'], ['done', 'Terminées'], ['city', 'City+'], ['taxi', 'Vela Taxi']].map((x) => '<button role="tab" aria-selected="' + (f === x[0]) + '" class="' + (f === x[0] ? 'on' : '') + '" data-action="filter" data-f="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      '<div class="card" style="padding:4px 16px">' + (list.length ? '<div class="list">' + list.map((h) => '<div class="li"><span class="tile-ic ' + (h.type === 'taxi' ? 't-violet' : 't-pink') + '">' + ic(h.type === 'taxi' ? 'taxi' : 'bag', 18) + '</span><div class="grow"><b class="trunc" style="display:block">' + esc(h.from) + ' → ' + esc(h.to) + '</b><span class="tiny muted">' + (isToday(h.t) ? 'Aujourd\'hui' : new Date(h.t).toLocaleDateString('fr-FR')) + ' · ' + hm(h.t) + (h.reason ? ' · ' + esc(h.reason) : '') + '</span></div><div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">' + (h.amount ? '<b style="color:var(--lime)">+' + fmt(h.amount) + '</b>' : '') + statusChip(h) + '</div></div>').join('') + '</div>' : '<div class="empty">Aucune mission pour ce filtre.</div>') + '</div>' +
      '</div>';

  function settingRow(icon, tone, title, sub, action, on) {

  /* =========================================================
     Panneaux (sheets)
     ========================================================= */
  function openSheet(name, data) {
    ui.sheet = name;
    ui.sheetData = data || null;
    renderSheet();
    $('scrim').classList.add('open');
    $('sheet').classList.add('open');
    setTimeout(() => { const f = $('sheet').querySelector('button, input'); if (f) f.focus({ preventScroll: true }); }, 50);
  }
  function closeSheet() {
    ui.sheet = null;
    $('scrim').classList.remove('open');
    $('sheet').classList.remove('open');
  }
  function renderSheet() {
    const n = ui.sheet;
    if (!n) return;
    const head = (t, sub) => '<div class="between"><h2>' + t + '</h2><button class="icon-btn" data-action="close-sheet" aria-label="Fermer">' + ic('x', 20) + '</button></div>' + (sub ? '<p class="small muted" style="margin-top:-8px">' + sub + '</p>' : '');
    let h = '';
    const m = S.mission;
    if (n === 'share') {
      const dest = m ? missionTarget(m).name : 'votre destination';
      h = head('Partager mon trajet en direct', 'Vos proches suivent votre position jusqu\'à ' + esc(dest) + '. Le lien expire automatiquement à la fin de la mission.');
      if (!S.contacts.length) {
        h += '<div class="empty">' + ic('user', 30) + '<span>Aucun proche enregistré.</span><button class="btn btn-lime btn-sm" data-action="goto-profile">Ajouter un proche</button></div>';
      } else {
        h += '<div class="stack" style="gap:8px">' + S.contacts.map((c) => {
          const sel = S.share.with.includes(c.id);
          return '<button class="opt-row' + (sel ? ' sel' : '') + '" data-action="share-toggle" data-id="' + c.id + '" aria-pressed="' + sel + '"><div class="avatar" style="background:var(--s3)">' + initials(c.name) + '</div><div class="grow"><b style="display:block">' + esc(c.name) + ' (' + esc(c.rel) + ')</b><span class="tiny muted">' + esc(c.phone) + '</span></div><span class="tick">' + ic('check', 13) + '</span></button>';
        }).join('') + '</div>';
        if (S.share.active) {
          h += '<div class="linkbox">' + ic('share', 14) + '<code id="shareLink">' + shareUrl() + '</code><button class="link" data-action="copy-link">Copier</button></div>';
          h += '<a class="btn btn-wa btn-block" href="' + waLink() + '" target="_blank" rel="noopener">' + ic('msg', 18) + 'Envoyer par WhatsApp</a>';
          h += '<div class="row"><button class="btn btn-lime grow" data-action="share-start">Mettre à jour</button><button class="btn" style="background:rgba(255,90,82,.14);color:var(--red)" data-action="share-stop">Arrêter</button></div>';
        } else {
          h += '<button class="btn btn-lime btn-lg btn-block" data-action="share-start"' + (S.share.with.length ? '' : ' disabled') + '>' + ic('pin', 20) + 'Démarrer le partage</button>';
        }
      }
    } else if (n === 'sos') {
      h = head('Alerte SOS Vela', 'Le centre de sécurité Vela et vos proches reçoivent votre position en direct. Utilisez-la uniquement en cas de danger.');
      if (S.sos) {
        h += '<div class="sos-live row">' + ic('sos', 20) + '<div class="grow"><b>Alerte active</b><div class="small">Un agent Vela vous rappelle. Restez dans un lieu sûr.</div></div></div><button class="btn btn-ghost btn-block" data-action="sos-cancel">Annuler l\'alerte (fausse alerte)</button>';
      } else {
        h += '<div class="inset small">Position envoyée : <b>' + esc(nearestPlace().name) + '</b><br>Véhicule : ' + esc(S.driver.vehicle) + ' · ' + esc(S.driver.plate) + '</div>';
        h += '<button class="btn btn-red btn-lg btn-block" data-action="sos-confirm">' + ic('sos', 20) + 'Déclencher l\'alerte</button><button class="btn btn-ghost btn-block" data-action="close-sheet">Je suis en sécurité</button>';
      }
    } else if (n === 'report') {
      h = head('Signaler sur l\'itinéraire', 'Les autres chauffeurs Vela seront prévenus.');
      h += '<div class="grid-2">' + [['Accident', 'warn'], ['Contrôle police', 'shield'], ['Bouchon', 'traffic'], ['Route inondée', 'map']].map((x) => '<button class="opt-row" style="flex-direction:column;align-items:flex-start" data-action="report-pick" data-v="' + x[0] + '"><span class="tile-ic t-lime">' + ic(x[1], 18) + '</span><b>' + x[0] + '</b></button>').join('') + '</div>';
    } else if (n === 'contact') {
      const kind = ui.sheetData;
      const c = m ? m.customer : null;
      h = head(kind === 'sms' ? 'Message au client' : 'Appeler le client', c ? esc(c.name) : '');
      if (c) {
        h += '<div class="linkbox" style="font-size:16px"><code id="custPhone" style="color:var(--fg)">' + esc(c.phone) + '</code><button class="link" data-action="copy-phone">Copier</button></div>';
        if (kind === 'sms') {
          h += '<div class="stack" style="gap:8px">' + ['J\'arrive dans ' + Math.max(1, Math.round((m.leg ? (m.leg.len - m.traveled) * 0.025 : 0) / 27 * 60)) + ' min.', 'Je suis sur place, ' + esc(S.driver.vehicle) + '.', 'Je ne trouve pas l\'adresse, pouvez-vous m\'appeler ?'].map((t) => '<button class="opt-row" data-action="sms-send" data-v="' + esc(t) + '">' + ic('msg', 16) + '<span class="grow">' + t + '</span>' + ic('send', 16) + '</button>').join('') + '</div>';
        } else {
          h += '<p class="small muted">Appel masqué via Vela : votre numéro reste privé. Composez ce numéro depuis votre téléphone.</p><a class="btn btn-lime btn-block" href="tel:' + c.phone.replace(/\s/g, '') + '">' + ic('phone', 18) + 'Appeler</a>';
        }
      }
    } else if (n === 'cancel') {
      h = head('Annuler la mission ?', 'Une annulation baisse votre taux d\'acceptation.');
      h += '<div class="stack" style="gap:8px">' + ['Client injoignable', 'Adresse introuvable', 'Problème avec le véhicule', 'Colis non prêt / passager absent'].map((r) => '<button class="opt-row" data-action="cancel-confirm" data-v="' + r + '">' + ic('x', 16) + '<span class="grow">' + r + '</span></button>').join('') + '</div><button class="btn btn-ghost btn-block" data-action="close-sheet">Continuer la mission</button>';
    } else if (n === 'notifs') {
      h = head('Notifications');
      h += S.notifs.length ? '<div class="list">' + S.notifs.map((x) => '<div class="li">' + '<span class="status-dot' + (x.read ? '' : ' on') + '" style="animation:none"></span><div class="grow small">' + esc(x.text) + '<div class="tiny muted">' + hm(x.t) + '</div></div></div>').join('') + '</div>' : '<div class="empty">Aucune notification.</div>';
      if (S.offer) h += '<button class="btn btn-lime btn-block" data-action="sheet-go" data-view="offer">Voir l\'offre en attente</button>';
    } else if (n === 'parking') {
      const t = m ? missionTarget(m) : nearestPlace();
      h = head('Parkings près de ' + esc(t.short), 'Places libres en temps réel.');
      h += '<div class="stack" style="gap:8px">' + [['Parking ' + t.short + ' Centre', '120 m', 14, '300 F/h'], ['Parking souterrain ' + t.short, '350 m', 42, '500 F/h'], ['Dépose-minute Vela', '60 m', 3, 'Gratuit 10 min']].map((p) => '<button class="opt-row" data-action="park-pick" data-v="' + esc(p[0]) + '"><span class="tile-ic t-violet">' + ic('park', 18) + '</span><div class="grow"><b style="display:block">' + esc(p[0]) + '</b><span class="tiny muted">' + p[1] + ' · ' + p[3] + '</span></div><span class="chip chip-green">' + p[2] + ' libres</span></button>').join('') + '</div>';
    } else if (n === 'code-help') {
      h = head('Problème de code ?', '');
      h += '<p class="small muted">Demandez à la cliente d\'ouvrir City+ → Commandes → ' + (m ? m.id : '') + '. Le code s\'affiche en haut de l\'écran.</p><button class="btn btn-block" data-action="resend-code">' + ic('refresh', 18) + 'Renvoyer le code par SMS à la cliente</button>';
    }
    $('sheet').innerHTML = h;

  /* =========================================================
     Mode conduite
     ========================================================= */
  const D = { raf: 0, last: 0, speed: 0, tilt: true, follow: true, traffic: true, lastMan: -1, announced200: -1, saveAcc: 0 };
  function enterDrive() {
    const m = S.mission;
    if (!m || !(m.phase === 'to_pickup' || m.phase === 'to_drop')) return;
    if (!m.leg) m.leg = buildRoute(S.pos, missionTarget(m), m.avoidToll);
    ui.driving = true;
    buildDrive();
    $('drive').hidden = false;
    document.body.style.overflow = 'hidden';
    D.last = performance.now();
    D.lastMan = -1;
    renderBanner();
    const t = missionTarget(m);
    speak('Navigation vers ' + t.short + '. ' + (m.leg.km) + ' kilomètres.');
    loop();
  }
  function exitDrive(silent) {
    ui.driving = false;
    cancelAnimationFrame(D.raf);
    $('drive').hidden = true;
    document.body.style.overflow = '';
    save(true);
    if (!silent) render();
  }

  function buildDrive() {
    const m = S.mission;
    const t = missionTarget(m);
    const isTaxi = m.type === 'taxi';
    const nextLabel = m.phase === 'to_pickup' ? (isTaxi ? 'Prise en charge · ' : 'Collecte · ') + t.short : (isTaxi ? 'Destination · ' : 'Livraison · ') + t.short;

          '<button class="qa' + (m.avoidToll ? ' on' : '') + '" data-action="d-avoid" id="dAvoid">' + ic('fork', 22, ' style="color:var(--violet-soft)"') + 'Évitement</button>' +
          '<button class="qa' + (S.share.active ? ' on' : '') + '" data-action="open-share" id="dShareQa">' + ic('pin', 22, ' style="color:var(--lime)"') + (S.share.active ? 'Partagé' : 'Partager') + '</button>' +
          '<button class="qa sos" data-action="open-sos">' + ic('sos', 22) + 'SOS Vela</button>' +
        '</div>' +
        '<div class="row"><button class="btn btn-violet btn-lg grow" data-action="parking" style="border-radius:16px"><span style="width:26px;height:26px;border-radius:8px;background:#fff;color:var(--violet);display:grid;place-items:center;font-family:var(--display)">P</span><span class="trunc">Trouver parking ' + esc(t.short) + '</span></button>' +
        '<button class="btn btn-lime btn-lg" style="width:56px;padding:0;border-radius:16px" data-action="call" aria-label="Appeler le client">' + ic('phone', 22) + '</button></div>' +
      '</div>';
    updateDriveSide();
    tick(0);
  }
  function nearestPlaceTo(p) { return PLACES.slice().sort((a, b) => dist(a, p) - dist(b, p))[0]; }

  function updateDriveSide() {
    if (!ui.driving) return;
    const m = S.mission;
    const sh = $('dShare');
    if (sh) sh.innerHTML = S.share.active ? '<div class="share-live"><div class="row small" style="color:var(--green);font-weight:700"><span class="live"></span>Partage de trajet en direct actif<span class="grow"></span><span class="muted" style="font-weight:500" data-share-timer>' + mmss((Date.now() - S.share.startedAt) / 1000) + '</span></div><div class="between small"><span class="trunc">Partagé avec : <b>' + esc(shareNames()) + '</b></span><a class="btn btn-wa btn-sm" href="' + waLink() + '" target="_blank" rel="noopener">' + ic('msg', 14) + 'WhatsApp</a></div><div class="between tiny muted"><span class="row" style="gap:4px">' + ic('lock', 12) + 'Position chiffrée jusqu\'à ' + esc(missionTarget(m).short) + '</span><button class="link" data-action="open-share">Gérer</button></div></div>' : '';
    const so = $('dSos');
    if (so) so.innerHTML = S.sos ? '<div class="sos-live between small"><span class="row">' + ic('sos', 18) + '<b>SOS actif · centre Vela alerté</b></span><button class="link" style="color:#ffb4ab" data-action="open-sos">Gérer</button></div>' : '';
    const q = $('dShareQa');
    if (q) { q.classList.toggle('on', S.share.active); q.lastChild.textContent = S.share.active ? 'Partagé' : 'Partager'; }
    const a = $('dAlert');
    if (a) {
      const leg = m.leg;
      if (leg.bridge === 'hkb') a.innerHTML = '<span>Trafic très fluide sur le Pont HKB</span><span class="chip" style="background:#000;color:var(--lime)">−10 min vs Adjamé</span>';
      else if (leg.bridge === 'dg') a.innerHTML = '<span>' + (m.avoidToll ? 'Itinéraire sans péage via Pont De Gaulle' : 'Pont De Gaulle ralenti') + '</span><span class="chip" style="background:#000;color:var(--amber)">+4 min</span>';
      else a.innerHTML = '<span>Trafic fluide sur votre itinéraire</span><span class="chip" style="background:#000;color:var(--lime)">À l\'heure</span>';
    }
  }

  function loop() {
    D.raf = requestAnimationFrame((now) => {
      const dt = Math.min(0.1, (now - D.last) / 1000);
      D.last = now;
      if (ui.driving) { tick(dt); loop(); }
    });
  }

  function tick(dt) {
    const m = S.mission;
    if (!m || !m.leg) return;
    const leg = m.leg;
    const pos = pointAt(leg.pts, m.traveled);
    const onBridge = !!(leg.pts[pos.seg] && leg.pts[pos.seg - 1] && leg.pts[pos.seg - 1].bridge);
    const limit = onBridge ? 80 : 50;
    const target = limit - 6 + Math.sin(performance.now() / 1300) * 5;
    const nearEnd = (leg.len - m.traveled) * M_PER_UNIT < 150;
    const goal = nearEnd ? 22 : target;
    D.speed += (goal - D.speed) * Math.min(1, dt * 1.6);
    // 20 × temps réel × vitesse de simulation
    const simSec = dt * 20 * S.sim;
    m.traveled = Math.min(leg.len, m.traveled + (D.speed / 3.6) * simSec / M_PER_UNIT);
    const p = pointAt(leg.pts, m.traveled);
    S.pos = { x: p.x, y: p.y };

    const car = $('dCar');
    if (car) car.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + (p.angle * 180 / Math.PI).toFixed(1) + ')');
    const svg = $('dSvg');
    if (svg) svg.setAttribute('viewBox', D.follow ? (p.x - 110) + ' ' + (p.y - 170) + ' 220 300' : '-10 20 420 580');
    const routeEl = $('dRoute');
    if (routeEl) {
      const remain = [{ x: p.x, y: p.y }].concat(leg.pts.slice(p.seg));
      routeEl.setAttribute('points', remain.map((q) => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' '));
    }

    // Manœuvre suivante
    let acc = 0, idx = leg.pts.length - 1, cum = 0;
    for (let i = 1; i < leg.pts.length; i++) {
      acc += dist(leg.pts[i - 1], leg.pts[i]);
      if (acc > m.traveled + 0.5) { idx = i; cum = acc; break; }
    }
    if (!cum) cum = leg.len;
    const toNext = Math.max(0, (cum - m.traveled) * M_PER_UNIT);
    const dir = turnAt(leg.pts, idx);
    const wp = leg.pts[idx];
    const verb = dir === 'flag' ? 'Arrivée' : dir === 'right' ? 'Tournez à droite' : dir === 'left' ? 'Tournez à gauche' : 'Continuez tout droit';
    const title = dir === 'flag' ? wp.label : verb + ' · ' + wp.label;
    let sub = '';
    if (idx < leg.pts.length - 1) {
      const nd = turnAt(leg.pts, idx + 1);
      const segKm = dist(leg.pts[idx], leg.pts[idx + 1]) * M_PER_UNIT / 1000;
      sub = 'Puis ' + (nd === 'flag' ? 'arrivée à ' + leg.pts[idx + 1].label : (nd === 'up' ? 'continuer tout droit' : nd === 'right' ? 'à droite' : 'à gauche') + ' sur ' + segKm.toFixed(1) + ' km');
    } else sub = esc(missionTarget(m).detail);
    const setTxt = (id, v) => { const el = $(id); if (el && el.textContent !== v) el.textContent = v; };
    setTxt('dManD', toNext >= 1000 ? (toNext / 1000).toFixed(1) + ' km' : (Math.round(toNext / 10) * 10) + ' m');
    setTxt('dManT', title);
    setTxt('dManS', sub);
    if (D.lastMan !== idx) {
      const icEl = $('dManIc');
      if (icEl) icEl.innerHTML = ic(dir === 'flag' ? 'flag' : dir, 34);
      const lane = $('dLane');
      if (lane) { lane.hidden = dir !== 'right' && dir !== 'left'; lane.textContent = dir === 'left' ? 'Voie de gauche' : '2 voies de droite'; }
      if (D.lastMan !== -1) speak(dir === 'flag' ? 'Arrivée à ' + wp.label + ' dans ' + Math.round(toNext / 50) * 50 + ' mètres' : verb + ', ' + wp.label);
      D.lastMan = idx;
      D.announced200 = -1;
    }
    if (toNext < 220 && toNext > 120 && D.announced200 !== idx && dir !== 'flag') {
      D.announced200 = idx;
      speak('Dans 200 mètres, ' + verb.toLowerCase() + ', ' + wp.label);
    }

    const remKm = (leg.len - m.traveled) * M_PER_UNIT / 1000;
    const remMin = Math.max(remKm > 0.05 ? 1 : 0, Math.round(remKm / 27 * 60));
    setTxt('dSpeed', String(Math.round(D.speed)));
    const arc = $('dArc');
    if (arc) arc.setAttribute('stroke-dasharray', (Math.min(1, D.speed / 100) * 75).toFixed(1) + ' 100');
    setTxt('dLimit', String(limit));
    setTxt('dKm', remKm.toFixed(1) + ' km');
    setTxt('dMin', remMin + ' min');
    setTxt('dEta', hm(Date.now() + remMin * 60e3));
    const bar = $('dBar');
    if (bar) bar.style.width = (m.traveled / leg.len * 100).toFixed(1) + '%';
    const tr = $('dTraffic');
    if (tr) {
      const txt = onBridge ? (leg.bridge === 'hkb' ? 'Pont HKB fluide' : 'Pont De Gaulle ralenti') : 'Circulation fluide';
      if (tr.lastChild.textContent !== txt) { tr.innerHTML = ic('traffic', 14) + txt; tr.className = 'chip traffic-chip ' + (onBridge && leg.bridge === 'dg' ? 'chip-amber' : 'chip-green'); }
    }
    const st = document.querySelector('[data-share-timer]');
    if (st) st.textContent = mmss((Date.now() - S.share.startedAt) / 1000);

    D.saveAcc += dt;
    if (D.saveAcc > 2) { D.saveAcc = 0; save(); }

    if (m.traveled >= leg.len - 0.01 && dt > 0) {
      arrive();
      exitDrive(true);
      toast('Vous êtes arrivé · ' + missionTarget(m).short);
      go('mission', true);
    }
  }

  function toggleAvoid() {
    const m = S.mission;
    if (!m) return;
    const from = pointAt(m.leg.pts, m.traveled);
    const target = missionTarget(m);
    const next = !m.avoidToll;
    const newLeg = buildRoute({ x: from.x, y: from.y, short: 'Position' }, target, next);
    if (!next && !newLeg.bridge && !m.leg.bridge) { toast('Aucun péage sur cet itinéraire'); return; }
    if (next && m.leg.bridge !== 'hkb') { toast('Votre itinéraire évite déjà le péage HKB'); m.avoidToll = true; save(); rebuildDrive(); return; }
    const diffMin = newLeg.min - Math.round((m.leg.len - m.traveled) * M_PER_UNIT / 1000 / 27 * 60);
    m.avoidToll = next;
    m.leg = newLeg;
    m.traveled = 0;
    save();
    rebuildDrive();
    toast(next ? 'Itinéraire sans péage via Pont De Gaulle (' + (diffMin >= 0 ? '+' : '') + diffMin + ' min)' : 'Itinéraire le plus rapide rétabli');
    speak(next ? 'Nouvel itinéraire sans péage' : 'Itinéraire le plus rapide');
  }
  function rebuildDrive() { if (ui.driving) { buildDrive(); } }

  /* =========================================================
     Actions
     ========================================================= */
  const A = {
    go: (el) => go(el.dataset.view),
    back: () => back(),
    'sheet-go': (el) => { closeSheet(); go(el.dataset.view); },

    drive: () => enterDrive(),

      save();

    report: () => openSheet('report'),
    'report-pick': (el) => {

      notify('Signalement envoyé : ' + el.dataset.v + ' près de ' + nearestPlace().short);

    },

    },
    'd-avoid': () => toggleAvoid(),

    'd-traffic': () => { D.traffic = !D.traffic; rebuildDrive(); toast(D.traffic ? 'Couche trafic affichée' : 'Couche trafic masquée'); },
    'd-follow': (el) => { D.follow = !D.follow; el.classList.toggle('on', D.follow); toast(D.follow ? 'Suivi du véhicule' : 'Vue d\'ensemble de l\'itinéraire'); },
    'd-sim': (el) => { S.sim = S.sim === 1 ? 2 : S.sim === 2 ? 4 : 1; el.textContent = '×' + S.sim; save(); },
    notifs: () => { openSheet('notifs'); S.notifs.forEach((n) => { n.read = true; }); save(); renderChrome(); },

    filter: (el) => { ui.filter = el.dataset.f; render(); },

    convert: () => {

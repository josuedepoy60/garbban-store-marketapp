      S.vm -= v; S.fcfa += v;
      const t = Date.now();
      S.tx.unshift({ id: uid(), label: 'Conversion VM → FCFA', amount: v, unit: 'F', t }, { id: uid(), label: 'Conversion VM → FCFA', amount: -v, unit: 'VM', t });
      notify(fmt(v) + ' VM convertis en FCFA');
      ui.convVal = ''; ui.errors = {};
      save(); render(); toast(fmt(v) + ' VM convertis · solde FCFA ' + fmt(S.fcfa) + ' F');
    },
    withdraw: () => {
      const v = parseAmount($('wdAmt').value);
      const num = $('wdNum').value.replace(/\D/g, '').replace(/^225/, '');
      ui.wdVal = $('wdAmt').value; ui.wdNum = $('wdNum').value; ui.wdOp = $('wdOp').value;
      ui.errors = {};
      if (!v || v < 1000) ui.errors.wd = 'Montant minimum de retrait : 1 000 F.';
      else if (v > S.fcfa) ui.errors.wd = 'Solde FCFA insuffisant (' + fmt(S.fcfa) + ' F). Convertissez d\'abord des VM.';
      if (!/^(01|05|07)\d{8}$/.test(num)) ui.errors.wdNum = 'Numéro ivoirien à 10 chiffres commençant par 01, 05 ou 07.';
      if (ui.errors.wd || ui.errors.wdNum) { render(); return; }
      S.fcfa -= v;
      S.tx.unshift({ id: uid(), label: 'Retrait ' + ui.wdOp + ' · ' + num.slice(0, 2) + ' •• •• ' + num.slice(-2), amount: -v, unit: 'F', t: Date.now() });
      notify('Retrait de ' + fmt(v) + ' F vers ' + ui.wdOp + ' effectué');
      ui.wdVal = '';
      save(); render(); toast('Retrait envoyé vers ' + ui.wdOp);
    },
    'svc-city': () => toggleService('city'),
    'svc-taxi': () => toggleService('taxi'),
    voice: () => { S.voice = !S.voice; save(); render(); toast(S.voice ? 'Guidage vocal activé' : 'Guidage vocal désactivé'); },
    sim: (el) => { S.sim = +el.dataset.v; save(); render(); },
    'add-contact': () => {
      const name = $('cName').value.trim(), rel = $('cRel').value.trim() || 'Proche', phone = $('cPhone').value.trim();
      ui.cName = name; ui.cRel = $('cRel').value; ui.cPhone = phone;
      ui.errors = {};
      if (name.length < 2) ui.errors.cName = 'Indiquez le nom du proche.';
      const digits = phone.replace(/\D/g, '').replace(/^225/, '');
      if (!/^(01|05|07)\d{8}$/.test(digits)) ui.errors.cPhone = 'Numéro ivoirien à 10 chiffres (01, 05 ou 07).';
      if (ui.errors.cName || ui.errors.cPhone) { render(); return; }
      const c = { id: uid(), name, rel, phone: '+225 ' + digits.replace(/(\d{2})(?=\d)/g, '$1 ') };
      S.contacts.push(c);
      if (!S.share.with.length) S.share.with = [c.id];
      ui.cName = ui.cRel = ui.cPhone = '';
      save(); render(); toast(name + ' ajouté à vos proches');
    },
    'del-contact': (el) => {
      const id = el.dataset.id;
      S.contacts = S.contacts.filter((c) => c.id !== id);
      S.share.with = S.share.with.filter((x) => x !== id);
      if (S.share.active && !S.share.with.length) stopShare();
      save(); render();
    },
    reset: () => {
      if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { ui.resetArmed = false; if (ui.view === 'profile') render(); }, 4000); return; }
      exitDrive(true);
      S = seed();
      ui.resetArmed = false;
      ui.nextOfferAt = Date.now() + 7000;
      save(true);
      ui.stack = [];
      go('home', true);
      toast('Démo réinitialisée');
    }
  };
  function fail(key, msg) { ui.errors = {}; ui.errors[key] = msg; render(); }
  function parseAmount(s) { return parseInt(String(s).replace(/\D/g, ''), 10) || 0; }
  function toggleService(t) {
    S.services[t] = !S.services[t];
    if (!S.services[t] && S.offer && S.offer.type === t) closeOffer('expired');
    save(); render();
    toast((t === 'taxi' ? 'Courses Vela Taxi ' : 'Livraisons City+ ') + (S.services[t] ? 'activées' : 'désactivées'));
  }
  function afterShareChange() {
    if (ui.driving) updateDriveSide();
    else if (ui.view === 'mission') render();
  }
  function copy(el) {
    if (!el) return;
    const text = el.textContent;
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(el);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast('Texte sélectionné, copiez-le');
    };
    try {
      navigator.clipboard.writeText(text).then(() => toast('Copié'), fallback);
    } catch (e) { fallback(); }
  }

  function checkPin() {
    const m = S.mission;
    const val = [0, 1, 2, 3].map((i) => $('pin' + i).value).join('');
    if (!/^\d{4}$/.test(val)) return;
    if (val !== m.code) {
      ui.pinTries++;
      ui.errors = { pin: ui.pinTries >= 3 ? 'Trois essais incorrects. Utilisez « Problème de code ? » pour renvoyer le code.' : 'Code incorrect. Vérifiez avec la cliente (' + (3 - ui.pinTries) + ' essai' + (3 - ui.pinTries > 1 ? 's' : '') + ' restant' + (3 - ui.pinTries > 1 ? 's' : '') + ').' };
      if (ui.pinTries >= 3) { m.code = String(1000 + Math.floor(Math.random() * 9000)); ui.pinTries = 0; save(); }
      render();
      return;
    }
    ui.errors = {};
    complete();
    render();
    toast('+' + fmt(m.net) + ' VM crédités sur votre portefeuille');
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('.pins input')) {
      t.value = t.value.replace(/\D/g, '').slice(-1);
      const i = +t.id.slice(3);
      if (t.value && i < 3) $('pin' + (i + 1)).focus();
      const full = [0, 1, 2, 3].every((k) => $('pin' + k).value);
      $('confirmPin').disabled = !full;
      if (ui.errors.pin) { ui.errors.pin = ''; const p = $('pins'); if (p) p.classList.remove('bad'); const em = p && p.nextElementSibling; if (em && em.classList.contains('err-msg')) em.remove(); }
      if (full && i === 3) checkPin();
    }
    if (t.id === 'convAmt') { const v = parseAmount(t.value); t.value = v ? fmt(v) : ''; ui.convVal = t.value; }
    if (t.id === 'wdAmt') { const v = parseAmount(t.value); t.value = v ? fmt(v) : ''; ui.wdVal = t.value; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (ui.sheet) closeSheet(); else if (ui.driving) A['d-exit'](); }
    if (e.key === 'Backspace' && e.target.matches('.pins input') && !e.target.value) {
      const i = +e.target.id.slice(3);
      if (i > 0) $('pin' + (i - 1)).focus();
    }
    if (e.key === 'Enter' && e.target.id === 'convAmt') A.convert();
  });

  /* =========================================================
     Horloge globale (1 s) : offres, comptes à rebours, attente
     ========================================================= */
  setInterval(() => {
    const now = Date.now();
    if (S.offer) {
      const left = offerLeft();
      document.querySelectorAll('[data-offer-left]').forEach((el) => { el.textContent = left; });
      const s = document.querySelector('[data-offer-left-s]');
      if (s) s.textContent = left + 's';
      const ring = document.querySelector('[data-offer-ring]');
      if (ring) ring.setAttribute('stroke-dasharray', (left / S.offer.ttl * 100).toFixed(1) + ' 100');
      if (left <= 0) {
        const wasView = ui.view === 'offer';
        closeOffer('expired');
        notify('Offre expirée · proposée à un autre chauffeur');
        toast('Offre expirée · proposée à un autre chauffeur');
        if (wasView) { ui.stack = []; go('home', true); } else render();
      }
    } else if (canReceive() && !ui.searching && !ui.driving && now > ui.nextOfferAt) {
      pushOffer();
    }
    const w = document.querySelector('[data-wait]');
    if (w && S.mission && S.mission.waitStart) w.textContent = mmss((now - S.mission.waitStart) / 1000);
  }, 1000);

  window.addEventListener('beforeunload', () => save(true));

  render();
})();
</script>
</body>
</html>
